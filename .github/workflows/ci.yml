name: Validate deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install --upgrade pip==26.3
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
      - run: pip-audit -r backend/requirements.lock
      - run: npm ci && npm audit && npm run build
        working-directory: frontend
      - name: Build Vercel frontend against Render API
        env:
          VITE_API_BASE_URL: https://signal-api.onrender.com/api/v1
        run: npm run build
        working-directory: frontend
      - run: bash -n scripts/start-render.sh
